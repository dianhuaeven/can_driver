# =============================================================================
# can_driver_node 机械臂专用配置
# =============================================================================

can_driver_node:
  control_frequency: 100.0
  debug_bypass_ros_control: false
  motor_query_hz: 20.0
  pp_fast_write_enabled: true
  pp_position_default_velocity_rad_s: 1.0472
  pp_csp_default_velocity_rad_s: 3
  startup_position_sync_timeout_sec: 1.0
  safety_stop_on_fault: true
  safety_require_enabled_for_motion: true
  max_position_step_rad: 0.0
  safety_hold_after_device_recover: true
  init_loopback: false
  pp_local_zero_offset_persistence_enabled: true
  pp_zero_offset_persist_on_apply_to_motor: false

  joints:
    - name: elbow_pitch_joint
      motor_id: 0x13
      protocol: PP
      can_device: canable1
      control_mode: csp
      position_scale: 65536
      velocity_scale: 65536
      direction_sign: -1.0
      ip_max_velocity: 1.0
      ip_max_acceleration: 0.8
      ip_max_jerk: 4.0
      ip_goal_tolerance: 0.001

    - name: wrist_pitch_joint
      motor_id: 0x14
      protocol: PP
      can_device: canable1
      control_mode: csp
      position_scale: 65536
      velocity_scale: 65536
      ip_max_velocity: 1.0
      ip_max_acceleration: 2.0
      ip_max_jerk: 10.0
      ip_goal_tolerance: 0.001

    - name: wrist_roll_joint
      motor_id: 0x16
      protocol: PP
      can_device: canable1
      control_mode: csp
      position_scale: 65536
      velocity_scale: 65536

    - name: wrist_yaw_joint
      motor_id: 0x15
      protocol: PP
      can_device: canable1
      control_mode: csp
      position_scale: 65536
      velocity_scale: 65536
      direction_sign: -1.0

    - name: left_gripper_finger_joint
      motor_id: 0x17
      protocol: PP
      can_device: canable1
      control_mode: csp
      position_scale: 65536
      velocity_scale: 65536
